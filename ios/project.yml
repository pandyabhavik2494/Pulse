name: Pulse
options:
  bundleIdPrefix: com.bhavikpandya
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: BPPU7JV4Q4
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - Pulse
      - Shared/Core
      - Shared/Health
      - Shared/UI
    resources: []
    entitlements:
      path: Config/Pulse.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.com.bhavikpandya.pulse]
    info:
      path: Config/Pulse-Info.plist
      properties:
        CFBundleDisplayName: Pulse
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSHealthShareUsageDescription: Pulse reads your burned energy, steps, food from MyFitnessPal, weigh-ins from VeSync, heart and sleep from Apple Health to show your day and your journey.
        NSHealthUpdateUsageDescription: Pulse never writes to Apple Health. Debug builds can add sample data in the Simulator for screenshots.
        CFBundleURLTypes:
          - CFBundleURLName: com.bhavikpandya.pulse
            CFBundleURLSchemes: [pulse]
        UIBackgroundModes: [processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikpandya.pulse
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PulseWidget
      - target: PulseWatch
  PulseWidget:
    type: app-extension
    platform: iOS
    sources:
      - Shared/Core
      - Shared/UI
      - Shared/Widgets
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bhavikpandya.pulse]
    info:
      path: Config/PulseWidget-Info.plist
      properties:
        CFBundleDisplayName: Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikpandya.pulse.widget
        TARGETED_DEVICE_FAMILY: "1"
  PulseWatch:
    type: application
    platform: watchOS
    sources:
      - PulseWatch
      - Shared/Core
      - Shared/Health
      - Shared/UI
    entitlements:
      path: Config/PulseWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.com.bhavikpandya.pulse]
    info:
      path: Config/PulseWatch-Info.plist
      properties:
        CFBundleDisplayName: Pulse
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bhavikpandya.pulse
        NSHealthShareUsageDescription: Pulse reads your burned energy, steps and food from Apple Health to show today's balance on your wrist.
        NSHealthUpdateUsageDescription: Pulse never writes to Apple Health. Debug builds can add sample data in the Simulator for screenshots.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikpandya.pulse.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PulseWatchWidget
  PulseWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Shared/Core
      - Shared/UI
      - Shared/Widgets
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bhavikpandya.pulse]
    info:
      path: Config/PulseWatchWidget-Info.plist
      properties:
        CFBundleDisplayName: Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikpandya.pulse.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PulseTests
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikpandya.pulse.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Pulse.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pulse"
        BUNDLE_LOADER: "$(TEST_HOST)"
  PulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PulseUITests
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikpandya.pulse.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pulse
schemes:
  Screenshots:
    build:
      targets:
        Pulse: all
        PulseUITests: [test]
    test:
      targets: [PulseUITests]

  Pulse:
    build:
      targets:
        Pulse: all
        PulseTests: [test]
    test:
      targets: [PulseTests]
  PulseWatch:
    build:
      targets:
        PulseWatch: all
